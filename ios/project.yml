name: iToPC
options:
  bundleIdPrefix: local.itopc
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  iToPC:
    type: application
    platform: iOS
    sources:
      - path: iToPC
    info:
      path: iToPC/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.itopc.camera
        PRODUCT_NAME: iToPC
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    scheme:
      testTargets: []

