name: iToPC
options:
  bundleIdPrefix: local.itopc
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  iToPC:
    type: application
    platform: iOS
    sources:
      - path: iToPC
    info:
      path: iToPC/Info.plist
      properties:
        CFBundleDisplayName: iToPC
        CFBundleShortVersionString: 0.2.4
        CFBundleVersion: 6
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: カメラ映像をWindows PCへ低遅延転送するために使用します。
        NSLocalNetworkUsageDescription: カメラ映像をUSBまたはローカルネットワーク経由でPCへ送信します。
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
          - camera-flash
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.itopc.camera
        PRODUCT_NAME: iToPC
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    scheme:
      testTargets: []
