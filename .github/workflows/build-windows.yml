name: Build iToPC apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - "ios/**"
      - "THIRD_PARTY_LICENSES/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build receiver and virtual camera
        shell: pwsh
        run: .\windows\scripts\build-receiver.ps1 -Runtime win-x64
      - name: Create distribution archive
        shell: pwsh
        run: Compress-Archive -Path .\windows\dist\iToPC-Receiver-win-x64\* -DestinationPath .\windows\dist\iToPC-Receiver-win-x64.zip -Force
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: iToPC-Receiver-win-x64
          path: windows/dist/iToPC-Receiver-win-x64.zip
          if-no-files-found: error

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Compile unsigned IPA
        run: |
          chmod +x ios/build-ipa.sh
          ios/build-ipa.sh
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: iToPC-unsigned-ipa
          path: ios/build/iToPC-unsigned.ipa
          if-no-files-found: error
